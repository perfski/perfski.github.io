<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · HeyTRACE</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #faf9f5;
      color: #1e2a3a;
      font-family: var(--font-sans);
      text-align: center;
    }
    .box { padding: 2rem; }
    h1 {
      font-size: clamp(3.5rem, 10vw, 6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 0 0 0.5rem;
      color: #d97757;
    }
    p { color: #5e5d59; margin: 0.4rem 0 2rem; }
    a.btn {
      display: inline-block;
      padding: 0.85rem 1.65rem;
      border-radius: 8px;
      background: #141413;
      color: #faf9f5;
      font-weight: 600;
      text-decoration: none;
    }
    a.btn:hover { box-shadow: 0 0 0 2px #141413; }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>页面不存在 · Page not found</p>
    <a class="btn" href="./">返回首页 · Back to Home</a>
  </div>
</body>
</html>
